# GoldenTeleports Configuration
# Main configuration file

# Cross-server homes, warps and spawn.
#
# Every home, warp and spawn is saved with the name of the server it was created on. When a
# player teleports to one that lives elsewhere, this server announces the destination over
# Redis and then asks the proxy to move the connection; the destination server places them on
# arrival. Requires a shared database (see database.yml: use mysql or mongo, not yaml) and a
# proxy (BungeeCord/Velocity).
MULTI_SERVER:
  ENABLED: false

  # Must match the name this server has in the proxy's config, since that is the name used to
  # transfer players to it. Give each server a distinct value.
  SERVER_NAME: "server-1"

  REDIS:
    # Servers that share a channel route teleports to each other. Use different channels to
    # keep two networks apart on the same Redis instance.
    CHANNEL: "gl-teleports"

    # Values support ${ENV_VAR} substitution so secrets can live outside this file.
    HOST: "localhost"
    PORT: 6379
    PASSWORD: ""
    # Refuse to start the bus with an empty password unless this is explicitly set to true.
    ALLOW_INSECURE: false

  # HMAC secret shared by all servers on the channel. Leave empty to disable signing
  # (NOT recommended: anyone able to publish to Redis could move players at will).
  SECRET: ""

  # Ticks to wait after the transferred player joins before placing them. Raise it if another
  # plugin moves players on join, or the teleport lands first and gets overwritten.
  ARRIVAL_DELAY: 30

  # Retry policy for failed publishes (non-blocking backoff).
  RETRY:
    ATTEMPTS: 3
    BACKOFF_MS: 100

# Home limits
home-limits:
  default: 3
  permissions:
    vip: 5      # golden.teleports.homes.limit.vip
    staff: 10   # golden.teleports.homes.limit.staff
    owner: -1   # golden.teleports.homes.limit.owner (-1 = unlimited)

# Teleport settings
teleport-settings:
  # General settings
  move-threshold: 0.1
  cancel-on-damage: true

  # Home teleportation
  home:
    delay: 3                  # Delay in seconds before teleport
    cooldown: 10              # Cooldown in seconds after teleport
    cost: 100.0               # Cost in economy (0.0 for free)
    immunity: 60              # Damage immunity in ticks after teleport (20 ticks = 1 second)
    cancel-on-move: true      # Cancel if player moves during delay
    effects: true             # Enable effects

  # Warp teleportation
  warp:
    delay: 0
    cooldown: 5
    cost: 50.0
    immunity: 20
    cancel-on-move: false
    effects: true

  # TPA teleportation
  tpa:
    delay: 5
    cooldown: 0
    cost: 0.0
    immunity: 0
    request-timeout: 30       # Time in seconds before request expires
    priority: "recent"        # "recent" or "oldest" - which request to accept/deny first
    cancel-on-move: true
    effects: true

  # TPA Here teleportation
  tpahere:
    delay: 5
    cooldown: 0
    cost: 0.0
    immunity: 0
    request-timeout: 30
    cancel-on-move: true
    effects: true

  # Spawn teleportation
  spawn:
    delay: 3
    cooldown: 0
    cost: 0.0
    immunity: 30
    cancel-on-move: true
    effects: true

# World blacklist per teleport type
blacklist:
  home:
    - "event_world"
    - "minigame_world"
  warp: []
  tpa:
    - "event_world"
  tpahere:
    - "event_world"
  spawn: []

# Safety checks for teleportation
safety:
  enabled: true
  min-height: 0
  max-height: 320
  check-radius: 2
  check-lava: true
  check-suffocation: true
  check-water-trap: true
  require-floor: true
  max-search-down: 5

