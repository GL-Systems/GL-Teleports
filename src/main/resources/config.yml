# Where each player was standing, remembered per server.
#
# Read when somebody arrives on a server with no teleport waiting for them - a plain /server
# switch, a hub button, the proxy moving them after a restart - so they land where they left
# rather than on the world spawn. A warp, home, spawn or accepted teleport request already says
# where the player should end up, and takes precedence.
last-location:
  enabled: true

  # Quitting saves too. This bounds how much is forgotten when a server stops without one.
  save-interval-seconds: 60

  # Extra time to wait before restoring, after Redis has confirmed there is no teleport waiting.
  #
  # The confirmation is waited for either way, so this is not a race against the lookup - it is
  # only a pause to let plugins that move players on join finish first. 0 means restore as soon as
  # the answer comes back, which is what you want unless something else is fighting over the
  # player's position.
  arrival-grace-seconds: 0

  # Never saved from, and never restored into. Useful for minigame or event worlds where the
  # position means nothing once the round is over.
  excluded-worlds: []

# Periodic JSON snapshots of warps, spawn and the homes of online players, written to
# plugins/GL-Teleports/backups/. Backend-independent, so a snapshot can be read back whichever
# storage is configured.
backups:
  enabled: true
  interval-minutes: 360
  keep: 10

# What happens when a player dies.
spawn:
  # Respawn at the spawn set with /setspawn instead of at the world spawn.
  #
  # Applied by answering the respawn event, not by teleporting afterwards, so the player only ever
  # appears in one place - no flicker and no second set of chunks loaded.
  #
  # Off by default: it changes behaviour every server already has, so it should be a choice.
  respawn-at-spawn: false

  # Let beds and respawn anchors win.
  #
  # A bed is the player's own deliberate answer to "where do I wake up", and overriding it makes
  # the block pointless. Set this to false if you want everybody funnelled through spawn whatever
  # they slept in.
  respawn-respects-bed: true

  # The server whose beds and respawn anchors are worth remembering across the network, matching
  # one of the values used for multi-server.server-name - your main survival server, typically.
  #
  # A bed only lives in that server's own player data, so anywhere else on the network has no way
  # to know about it. Setting this makes GL-Teleports remember that spawn point in the shared
  # database as well, so dying on a different server sends the player back to their bed here
  # instead of to the network spawn. Dying on this server itself is unaffected - vanilla already
  # handles the bed locally.
  #
  # Leave empty to turn this off: deaths on another server always go to the network spawn.
  bed-respawn-server: ""

# The /homes inventory menu.
#
# Turning this off does not remove the command: /homes then falls back to the chat listing,
# which is also always available as /listhomes and is what console gets either way.
#
# Layout, icons and wording live in menus/teleports-homes.yml.
#
# /warps has no menu; it prints its paged list.
menus:
  enabled: true

# A record of every teleport that happened.
#
# The only way to answer "how did this player get into my base". Nothing else in the plugin
# remembers where somebody came from, and a cross-server teleport that goes wrong is otherwise
# invisible - the player is simply somewhere unexpected and nobody can say why.
history:
  enabled: true

  # Records older than this are discarded by an hourly sweep. The log is the one table here that
  # grows without bound, and on the yaml backend the whole file is parsed on every read - so if
  # you are on yaml and busy, keep this short rather than long.
  retention-days: 30

  # Also record teleports that were refused: cooldowns, unsafe destinations, blacklisted worlds,
  # plugins cancelling them. Useful when diagnosing "it just does nothing", noisy otherwise.
  log-failures: false

# Homes one player has let another use, via /homeinvite.
home-shares:
  enabled: true

  # How many people one home may be shared with at a time. Expired grants do not count.
  max-per-home: 10

# Per-player /tpablock lists, alongside the all-or-nothing /tpatoggle.
tpa-blocks:
  enabled: true
  max-entries: 50

cooldowns:
  # Store cooldowns in Redis so they follow a player across the network.
  #
  # Without this, changing server resets every cooldown - one hop and a warp is usable again.
  # Reads still come from local memory, so this costs nothing on the teleport path; the shared
  # copy is written alongside and read back when the player joins somewhere else.
  #
  # Ignored entirely when multi-server is off.
  network: true

# Protection against everybody teleporting at once, which is what a restart looks like.
queue:
  # Each teleport can load a chunk, and a chunk load is main-thread work. Two hundred players
  # running /spawn in the same second lands as two hundred chunk loads in one tick without this.
  enabled: true

  # How many teleports may execute per tick. The rest wait a tick or two; nothing is dropped.
  max-per-tick: 4

  # Above this many waiting, players are told they are queued. Below it the wait is imperceptible
  # and a message would just be noise.
  notice-threshold: 20

performance:
  # Load the destination chunk off-thread before moving the player into it.
  #
  # player.teleport() into an unloaded chunk loads it synchronously, stopping the server while it
  # happens. Doing it in advance turns a visible stutter into a wait nobody feels. Falls back to
  # the old behaviour if the load times out, so the teleport always happens either way.
  preload-chunks: true

# /back
back:
  enabled: true

  # Servers /back refuses to use, same idea as blacklist.back above but for the network side: a
  # point on one of these servers is never saved, and /back refuses to send you to one even if a
  # point still names it from before it was added here. Only meaningful with multi-server on;
  # names are matched against multi-server.server-name.
  blocked-servers: []

# Importing homes and warps from other plugins: /glteleports migrate <source> [types] [confirm]
# (PlayerWarps brings player warps with their favourites, ratings, whitelists, managers and bans.)
# Types: homes, warps, playerwarps, or a comma-separated combination such as homes,playerwarps.
# Omit types to import everything the source provides. For HuskHomes homes only, use:
# /glteleports migrate huskhomes homes, then /glteleports migrate huskhomes homes confirm.
#
# Running the command first scans the other plugin's data and reports what would be imported,
# without writing anything. Nothing is imported until you repeat it with "confirm" within two
# minutes. The other plugin's files and database are only ever read, never changed or deleted.
# Take a backup of this plugin's data before confirming.
migrate:
  # The server to assign imported homes and warps to when multi-server is enabled and the source
  # does not say which server they belong to - EssentialsX never does, HuskHomes only does when
  # its own cross_server mode is on, and PlayerWarps only in its MySQL mode. Must match a multi-server.server-name on your network, usually
  # the server whose data you are importing.
  #
  # Ignored while multi-server is off: everything is then assigned to this server, exactly as if
  # it had been created here. With multi-server on and this left empty, a migration that needs it
  # stops before writing anything and says so.
  server: ""

  # With multi-server on, keep the server a source recorded for each entry (HuskHomes in
  # cross-server mode, PlayerWarps in MySQL mode) instead of assigning everything to the server above.
  use-source-server: true

  # When an imported home or warp has the same name as one that already exists here:
  #   skip    - keep the existing one and leave the imported one out
  #   rename  - import it under a free name such as base-2, keeping both (default)
  #   replace - overwrite the existing one with the imported one
  # An entry that already exists here at the same position is never imported twice, whichever
  # policy is chosen, so running the same migration again is harmless.
  # Player warps are never replaced, since that would delete another player's warp: with replace
  # they are left out like with skip. A player warp imported once is recognised on every later run
  # and left as it is, even if its owner changed it or deleted it since.
  conflict-policy: "rename"

  # Only changes the world name on newly imported entries. Existing GL-Teleports data and
  # the source plugin's data are not changed. Remove this rule after the intended migrations
  # if later imports should keep the source world name.
  world-mappings:
    Survival: Survival-2

  # Where each plugin keeps its data. Leave empty to look in its usual folder next to this one
  # (plugins/Essentials, plugins/HuskHomes, plugins/PlayerWarps). Set a path to read a copy taken
  # from another server. HuskHomes and PlayerWarps are read from the database their own config.yml
  # points at, with the same credentials, so nothing has to be configured twice.
  folders:
    essentials: ""
    huskhomes: ""
    playerwarps: ""

# Miscellaneous settings
clear-cooldowns-on-quit: false
