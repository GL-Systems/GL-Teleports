# GoldenTeleports Configuration
# Main configuration file

# Bumped whenever a release changes the shape of this file. The plugin compares it against the
# version it expects and says so on startup when they differ, so a stale file is noticed then
# rather than through whichever setting quietly stopped applying.
config-version: 1

# Cross-server homes, warps and spawn.
#
# Every home and warp is saved with the name of the server it was created on, and the network
# has a single spawn - /setspawn anywhere replaces it, and /spawn everywhere leads to it. When a
# player teleports to a destination that lives elsewhere, this server announces it over Redis
# and then asks the proxy to move the connection; the destination server places them on
# arrival. Requires a shared database (see database.yml: use mysql or mongo, not yaml) and a
# proxy (BungeeCord/Velocity).
multi-server:
  enabled: false

  # Must match the name this server has in the proxy's config, since that is the name used to
  # transfer players to it. Give each server a distinct value.
  server-name: "server-1"

  redis:
    # Servers that share a channel route teleports to each other. Use different channels to
    # keep two networks apart on the same Redis instance.
    channel: "gl-teleports"

    # Values support ${ENV_VAR} substitution so secrets can live outside this file.
    host: "localhost"
    port: 6379
    password: ""
    # Refuse to start the bus with an empty password unless this is explicitly set to true.
    allow-insecure: false

  # HMAC secret shared by every server on the channel, at least 32 characters. Required when
  # enabled is true: without it any client that can publish to Redis could move players at will.
  # Supports ${ENV_VAR} so it can live outside this file.
  secret: ""

  # Ticks to wait before placing a transferred player - the fallback path only.
  #
  # Arrivals are normally settled during login, before the world is sent to the client, so the
  # player simply appears at their destination with nothing to wait for and nothing to correct.
  # This delay applies only when the destination arrived too late for that: Redis lagging behind
  # the proxy, or a destination server that was still starting up. Then a real teleport is needed,
  # and this is how long to let other plugins finish with the player first.
  #
  # Leave it at 0 unless you see arrivals being overwritten by another plugin.
  arrival-delay: 0

  # Seconds a destination waits for its player before it is discarded. It must outlast the
  # slowest transfer the proxy might make: a destination server that is still starting up can
  # easily take longer than a minute, and an expired destination drops the teleport.
  pending-expiry-seconds: 120

  # Retry policy for failed publishes (non-blocking backoff).
  retry:
    attempts: 3
    backoff-ms: 100

# Home limits
home-limits:
  default: 3
  permissions:
    vip: 5      # golden.teleports.home.limit.vip
    staff: 10   # golden.teleports.home.limit.staff
    owner: -1   # golden.teleports.home.limit.owner (-1 = unlimited)

  # Caps that apply on top of the total above, not instead of it. A player at 3 of 3 homes is
  # still at their limit whatever these say; these only add a second, narrower ceiling.
  #
  # This is what lets you write "three homes, at most one of them in the nether". The world
  # blacklist cannot: it forbids the world outright rather than limiting it.
  #
  # World names are matched in lower case. A world or server not listed here has no extra cap.
  per-world: {}
  #  world_nether: 1
  #  world_the_end: 0

  per-server: {}
  #  events: 0
  #  survival: 3

# Teleport settings
teleport-settings:
  # General settings
  # How far a player may drift during a countdown before it is cancelled, in blocks, measured
  # from where they started rather than between ticks.
  move-threshold: 0.5
  cancel-on-damage: true

  # Home teleportation
  home:
    delay: 3                  # Delay in seconds before teleport
    cooldown: 10              # Cooldown in seconds after teleport
    cost: 100.0               # Cost in economy (0.0 for free)
    immunity: 60              # Damage immunity in ticks after teleport (20 ticks = 1 second)
    cancel-on-move: true      # Cancel if player moves during delay

  # Warp teleportation
  warp:
    delay: 0
    cooldown: 5
    cost: 50.0
    immunity: 20
    cancel-on-move: false

  # TPA teleportation
  tpa:
    delay: 5
    cooldown: 0
    cost: 0.0
    immunity: 0
    request-timeout: 30       # Time in seconds before request expires
    priority: "recent"        # "recent" or "oldest" - which request to accept/deny first
    max-outgoing: 5           # How many requests one player may have waiting at once
    cancel-on-move: true

  # TPA Here teleportation
  tpahere:
    delay: 5
    cooldown: 0
    cost: 0.0
    immunity: 0
    request-timeout: 30
    cancel-on-move: true

  # Spawn teleportation
  spawn:
    delay: 3
    cooldown: 0
    cost: 0.0
    immunity: 30
    cancel-on-move: true

# World blacklist per teleport type
blacklist:
  home:
    - "event_world"
    - "minigame_world"
  warp: []
  tpa:
    - "event_world"
  tpahere:
    - "event_world"
  spawn: []

# Safety checks for teleportation
safety:
  enabled: true

  # Height bounds. Left out, each world's own limits are used - which is almost always what you
  # want, since a fixed floor of 0 rejects everything below sea level in a 1.18+ world. Set them
  # only to tighten the range further; they are never allowed to widen it.
  # min-height: -64
  # max-height: 320

  check-radius: 1
  check-lava: true
  check-suffocation: true
  check-water-trap: true
  require-floor: true
  max-search-down: 5

  # When the destination is unsafe, look for a safe spot directly above or below it rather than
  # refusing outright. Without this, a home that happens to sit somewhere awkward is unreachable.
  relocate: true
  relocate-radius: 4

  # Damage cancelled while post-teleport immunity lasts. Combat causes are deliberately absent:
  # including them turns every teleport into an escape with a few seconds of invulnerability.
  immunity-causes:
    - "FALL"
    - "SUFFOCATION"
    - "FIRE_TICK"
    - "HOT_FLOOR"
    - "CONTACT"
    - "CRAMMING"

