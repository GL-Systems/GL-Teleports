name: GL-Teleports
version: '${version}'
description: Homes, warps, spawn and teleport requests, with optional cross-server support.
author: 7Str1kes
website: https://github.com/GL-Systems/GL-Teleports

main: org.glstudio.teleports.GTeleports
api-version: '1.21.4'
load: POSTWORLD

# Optional. Without Vault the economy costs in config.yml are simply not charged; without
# PlaceholderAPI the %glteleports_...% placeholders are never registered. Neither is required.
softdepend: [Vault, PlaceholderAPI]

# Scheme: golden.teleports.<module>.<action>
#
# The pre-1.1 names are still honoured. Each is declared at the bottom as a parent of its
# replacement, so granting an old node still grants what it always did — through Bukkit's child
# relationships, with no permission setup needing to change on the day you upgrade. They are
# scheduled for removal in the next major version.
permissions:
  golden.teleports.*:
    description: Everything below, including staff and bypass nodes.
    default: op
    children:
      golden.teleports.player.*: true
      golden.teleports.admin.*: true
      golden.teleports.bypass.*: true

  golden.teleports.player.*:
    description: The commands an ordinary player uses.
    default: true
    children:
      golden.teleports.home.use: true
      golden.teleports.home.set: true
      golden.teleports.home.delete: true
      golden.teleports.home.list: true
      golden.teleports.warp.use: true
      golden.teleports.warp.list: true
      golden.teleports.spawn.use: true
      golden.teleports.tpa.send: true
      golden.teleports.tpa.here: true
      golden.teleports.tpa.accept: true
      golden.teleports.tpa.deny: true
      golden.teleports.tpa.cancel: true
      golden.teleports.tpa.toggle: true
      golden.teleports.tpa.block: true
      golden.teleports.home.share: true
      golden.teleports.playerwarp.use: true
      golden.teleports.playerwarp.set: true
      golden.teleports.playerwarp.remove: true
      golden.teleports.playerwarp.list: true
      golden.teleports.playerwarp.desc: true
      golden.teleports.playerwarp.icon: true
      golden.teleports.playerwarp.category: true
      golden.teleports.playerwarp.rate: true
      golden.teleports.playerwarp.lock: true
      golden.teleports.playerwarp.cost: true
      golden.teleports.playerwarp.reset: true
      golden.teleports.playerwarp.rename: true
      golden.teleports.playerwarp.setowner: true
      golden.teleports.playerwarp.password: true
      golden.teleports.playerwarp.whitelist: true
      golden.teleports.playerwarp.ban: true
      golden.teleports.playerwarp.favourite: true
      golden.teleports.playerwarp.settings: true
      golden.teleports.back.use: true

  golden.teleports.home.use:
    description: Travel to one of your homes.
    default: true
  golden.teleports.home.set:
    description: Create or move one of your homes.
    default: true
  golden.teleports.home.delete:
    description: Delete one of your homes.
    default: true
  golden.teleports.home.list:
    description: List your own homes.
    default: true
  golden.teleports.warp.use:
    description: Travel to a warp. Warps may also carry a permission of their own.
    default: true
  golden.teleports.warp.list:
    description: List the warps you can use.
    default: true
  golden.teleports.spawn.use:
    description: Travel to spawn.
    default: true
  golden.teleports.tpa.send:
    description: Ask to teleport to another player.
    default: true
  golden.teleports.tpa.here:
    description: Ask another player to teleport to you.
    default: true
  golden.teleports.tpa.accept:
    description: Accept a teleport request.
    default: true
  golden.teleports.tpa.deny:
    description: Refuse a teleport request.
    default: true
  golden.teleports.tpa.cancel:
    description: Withdraw a request you sent.
    default: true
  golden.teleports.tpa.toggle:
    description: Turn incoming teleport requests off and on.
    default: true
  golden.teleports.tpa.block:
    description: Refuse teleport requests from one particular player.
    default: true
  golden.teleports.home.share:
    description: Let other players use your homes.
    default: true

  golden.teleports.playerwarp.use:
    description: Travel to a player warp with /pw <warp>.
    default: true
  golden.teleports.playerwarp.set:
    description: Create one of your own player warps, up to your limit.
    default: true
  golden.teleports.playerwarp.remove:
    description: Delete one of your own player warps.
    default: true
  golden.teleports.playerwarp.list:
    description: Open /pw and browse the list of player warps.
    default: true
  golden.teleports.playerwarp.desc:
    description: Set or clear a player warp's description.
    default: true
  golden.teleports.playerwarp.icon:
    description: Set or clear a player warp's icon.
    default: true
  golden.teleports.playerwarp.category:
    description: File a player warp under a category.
    default: true
  golden.teleports.playerwarp.rate:
    description: Rate somebody else's player warp.
    default: true
  golden.teleports.playerwarp.lock:
    description: Lock or unlock one of your own player warps.
    default: true
  golden.teleports.playerwarp.cost:
    description: Set or clear the cost to use one of your own player warps.
    default: true
  golden.teleports.playerwarp.reset:
    description: Move a player warp to where you are standing.
    default: true
  golden.teleports.playerwarp.rename:
    description: Rename one of your own player warps.
    default: true
  golden.teleports.playerwarp.setowner:
    description: Transfer ownership of one of your own player warps.
    default: true
  golden.teleports.playerwarp.password:
    description: Set or clear a password on one of your own player warps.
    default: true
  golden.teleports.playerwarp.whitelist:
    description: Manage the whitelist of one of your own player warps.
    default: true
  golden.teleports.playerwarp.ban:
    description: Manage bans on one of your own player warps.
    default: true
  golden.teleports.playerwarp.favourite:
    description: Favourite a player warp.
    default: true
  golden.teleports.playerwarp.settings:
    description: Open the settings menu of one of your own player warps.
    default: true

  golden.teleports.back.use:
    description: Return to where you were right before your last teleport.
    default: true

  golden.teleports.admin.*:
    description: Every staff-facing node.
    default: op
    children:
      golden.teleports.admin.reload: true
      golden.teleports.admin.backup: true
      golden.teleports.admin.history: true
      golden.teleports.admin.lock: true
      golden.teleports.admin.migrate: true
      golden.teleports.home.admin: true
      golden.teleports.warp.set: true
      golden.teleports.warp.delete: true
      golden.teleports.warp.others: true
      golden.teleports.spawn.set: true
      golden.teleports.spawn.others: true
      golden.teleports.playerwarp.admin.removeall: true
      golden.teleports.playerwarp.admin.managers: true
      golden.teleports.playerwarp.admin.reload: true
      golden.teleports.playerwarp.admin.view: true

  golden.teleports.playerwarp.admin.removeall:
    description: Delete every player warp belonging to a given player, and manage/delete any player warp regardless of ownership.
    default: op
  golden.teleports.playerwarp.admin.managers:
    description: Add or remove managers on any player warp.
    default: op
  golden.teleports.playerwarp.admin.reload:
    description: Reload the player-warps.yml configuration and its menus.
    default: op
  golden.teleports.playerwarp.admin.view:
    description: Open the player warps administration menu.
    default: op

  golden.teleports.admin.reload:
    description: Reload the configuration and read the plugin's status.
    default: op
  golden.teleports.admin.backup:
    description: Write a backup on demand.
    default: op
  golden.teleports.admin.history:
    description: Read the teleport audit log.
    default: op
  golden.teleports.admin.lock:
    description: Close and reopen warps and servers for maintenance.
    default: op
  golden.teleports.admin.migrate:
    description: Import homes, warps and player warps from EssentialsX, HuskHomes or PlayerWarps with /glteleports migrate.
    default: op
  golden.teleports.home.admin:
    description: Read and edit the homes of other players.
    default: op
  golden.teleports.warp.set:
    description: Create or move a warp.
    default: op
  golden.teleports.warp.delete:
    description: Delete a warp.
    default: op
  golden.teleports.warp.others:
    description: Send another player to a warp.
    default: op
  golden.teleports.spawn.set:
    description: Move this server's spawn.
    default: op
  golden.teleports.spawn.others:
    description: Send another player to spawn.
    default: op

  golden.teleports.bypass.*:
    description: Skip the restrictions that apply to everyone else.
    default: op
    children:
      golden.teleports.bypass.cooldown: true
      golden.teleports.bypass.delay: true
      golden.teleports.bypass.cost: true
      golden.teleports.bypass.safety: true
      golden.teleports.bypass.blacklist: true
      golden.teleports.bypass.lock: true
      golden.teleports.playerwarp.bypass.password: true
      golden.teleports.playerwarp.bypass.whitelist: true
      golden.teleports.playerwarp.bypass.ban: true
      golden.teleports.playerwarp.bypass.lock: true
      golden.teleports.playerwarp.bypass.cost: true

  golden.teleports.playerwarp.bypass.password:
    description: Teleport into a password-protected player warp without the password.
    default: op
  golden.teleports.playerwarp.bypass.whitelist:
    description: Teleport into a whitelisted player warp without being on the list.
    default: op
  golden.teleports.playerwarp.bypass.ban:
    description: Teleport into a player warp you are banned from.
    default: op
  golden.teleports.playerwarp.bypass.lock:
    description: Teleport into a player warp its owner locked.
    default: op
  golden.teleports.playerwarp.bypass.cost:
    description: Use a player warp without paying its cost.
    default: op

  # pw.limit.<N>: the highest granted N becomes a player's player-warp limit (see limits.default
  # in player-warps.yml for the floor when none is granted). Deliberately outside the
  # golden.teleports.* tree so it reads the same as EssentialsX-style per-rank limit nodes; grant
  # whichever numbers your rank ladder needs, e.g. pw.limit.3, pw.limit.10 - there is nothing to
  # declare here since the number is open-ended.
  pw.limit.unlimited:
    description: No player-warp limit at all.
    default: false

  golden.teleports.bypass.cooldown:
    description: Teleport without waiting out a cooldown.
    default: op
  golden.teleports.bypass.delay:
    description: Teleport without the countdown.
    default: op
  golden.teleports.bypass.cost:
    description: Teleport without paying.
    default: op
  golden.teleports.bypass.safety:
    description: Teleport to a destination the safety checks would reject.
    default: op
  golden.teleports.bypass.blacklist:
    description: Teleport into a blacklisted world.
    default: op
  golden.teleports.bypass.lock:
    description: Use a warp or server that is closed for maintenance.
    default: op

  golden.teleports.home.limit.vip:
    description: Grants the home limit configured under home-limits.permissions.vip.
    default: false
  golden.teleports.home.limit.staff:
    description: Grants the home limit configured under home-limits.permissions.staff.
    default: false
  golden.teleports.home.limit.owner:
    description: Grants the home limit configured under home-limits.permissions.owner.
    default: false
  golden.teleports.home.limit.unlimited:
    description: No home limit at all.
    default: false

  # ── Deprecated aliases ──────────────────────────────────────────────────────
  # Each grants its replacement as a child, so an existing permission setup keeps working
  # unchanged. Move to the new names when convenient; these go in the next major version.
  golden.teleports.home:
    description: 'Deprecated: use golden.teleports.home.use'
    default: false
    children:
      golden.teleports.home.use: true
  golden.teleports.sethome:
    description: 'Deprecated: use golden.teleports.home.set'
    default: false
    children:
      golden.teleports.home.set: true
  golden.teleports.delhome:
    description: 'Deprecated: use golden.teleports.home.delete'
    default: false
    children:
      golden.teleports.home.delete: true
  golden.teleports.listhomes:
    description: 'Deprecated: use golden.teleports.home.list'
    default: false
    children:
      golden.teleports.home.list: true
  golden.teleports.admin.homes:
    description: 'Deprecated: use golden.teleports.home.admin'
    default: false
    children:
      golden.teleports.home.admin: true
  golden.teleports.warp:
    description: 'Deprecated: use golden.teleports.warp.use'
    default: false
    children:
      golden.teleports.warp.use: true
      golden.teleports.warp.list: true
  golden.teleports.setwarp:
    description: 'Deprecated: use golden.teleports.warp.set'
    default: false
    children:
      golden.teleports.warp.set: true
  golden.teleports.delwarp:
    description: 'Deprecated: use golden.teleports.warp.delete'
    default: false
    children:
      golden.teleports.warp.delete: true
  golden.teleports.spawn:
    description: 'Deprecated: use golden.teleports.spawn.use'
    default: false
    children:
      golden.teleports.spawn.use: true
  golden.teleports.setspawn:
    description: 'Deprecated: use golden.teleports.spawn.set'
    default: false
    children:
      golden.teleports.spawn.set: true
  golden.teleports.tpa:
    description: 'Deprecated: use golden.teleports.tpa.send'
    default: false
    children:
      golden.teleports.tpa.send: true
  golden.teleports.tpahere:
    description: 'Deprecated: use golden.teleports.tpa.here'
    default: false
    children:
      golden.teleports.tpa.here: true
  golden.teleports.tpaccept:
    description: 'Deprecated: use golden.teleports.tpa.accept'
    default: false
    children:
      golden.teleports.tpa.accept: true
  golden.teleports.tpdeny:
    description: 'Deprecated: use golden.teleports.tpa.deny'
    default: false
    children:
      golden.teleports.tpa.deny: true
  golden.teleports.tpacancel:
    description: 'Deprecated: use golden.teleports.tpa.cancel'
    default: false
    children:
      golden.teleports.tpa.cancel: true
  golden.teleports.tpatoggle:
    description: 'Deprecated: use golden.teleports.tpa.toggle'
    default: false
    children:
      golden.teleports.tpa.toggle: true
  golden.teleports.homes.limit.vip:
    description: 'Deprecated: use golden.teleports.home.limit.vip'
    default: false
    children:
      golden.teleports.home.limit.vip: true
  golden.teleports.homes.limit.staff:
    description: 'Deprecated: use golden.teleports.home.limit.staff'
    default: false
    children:
      golden.teleports.home.limit.staff: true
  golden.teleports.homes.limit.owner:
    description: 'Deprecated: use golden.teleports.home.limit.owner'
    default: false
    children:
      golden.teleports.home.limit.owner: true
  golden.teleports.homes.limit.unlimited:
    description: 'Deprecated: use golden.teleports.home.limit.unlimited'
    default: false
    children:
      golden.teleports.home.limit.unlimited: true

# Downloaded by the server at load time instead of being shaded into the jar, so a
# server only pulls the backend it actually configured in database.yml. The PostgreSQL driver is
# only used to read a HuskHomes or PlayerWarps database during /glteleports migrate.
libraries:
  - com.zaxxer:HikariCP:6.0.0
  - org.xerial:sqlite-jdbc:3.45.1.0
  - com.h2database:h2:2.2.224
  - com.mysql:mysql-connector-j:8.3.0
  - org.mongodb:mongodb-driver-sync:5.1.0
  - org.mongodb:mongodb-driver-core:5.1.0
  - org.mongodb:bson:5.1.0
  - org.postgresql:postgresql:42.7.5
