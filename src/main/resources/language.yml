# GoldenTeleports Language Configuration
# All messages and text strings

# Bumped whenever a release changes the shape of this file. The plugin compares it against the
# version it expects and says so on startup when they differ, so a stale file is noticed then
# rather than through whichever setting quietly stopped applying.
config-version: 1

# Prepended to every message below, so the plugin identifies itself without each line repeating
# it. Leave empty for no prefix.
prefix: ""

# Error messages
errors:
  player-only: "<red>This command can only be used by players!</red>"
  no-permission: "<red>You don't have permission to do that!</red>"
  player-offline: "<red>That player is not online!</red>"
  player-not-found: "<red><yellow>{player}</yellow> could not be found.</red>"
  specify-player: "<red>Please specify a player!</red>"
  specify-warp: "<red>Please specify a warp name!</red>"
  specify-lock-target: "<red>Specify what to lock: <yellow>warp</yellow> or <yellow>server</yellow>.</red>"
  invalid-duration: "<red><yellow>{value}</yellow> is not a duration. Try 30m, 2h or 7d.</red>"
  unknown-warp-field: "<red><yellow>{field}</yellow> is not a warp setting. Use cost, cooldown or delay.</red>"

  # Scoped home limits, on top of the total. See home-limits.per-world / per-server in config.yml.
  home-limit-world: "<red>You may only keep <yellow>{limit}</yellow> home(s) in <yellow>{world}</yellow>.</red>"
  home-limit-server: "<red>You may only keep <yellow>{limit}</yellow> home(s) on <yellow>{server}</yellow>.</red>"

  # Shared homes
  shares-disabled: "<red>Home sharing is turned off on this server.</red>"
  share-self: "<red>You already have access to your own homes.</red>"
  share-limit-reached: "<red>That home is already shared with <yellow>{limit}</yellow> people.</red>"
  share-not-found: "<red><yellow>{player}</yellow> does not have access to <yellow>{home}</yellow>.</red>"
  home-not-shared: "<red><yellow>{player}</yellow> has not shared <yellow>{name}</yellow> with you.</red>"

  # Per-player TPA blocks
  tpa-blocks-disabled: "<red>Blocking individual players is turned off on this server.</red>"
  block-self: "<red>You cannot block yourself.</red>"
  already-blocked: "<red><yellow>{player}</yellow> is already blocked.</red>"
  not-blocked: "<red><yellow>{player}</yellow> is not blocked.</red>"
  block-limit-reached: "<red>You cannot block more than <yellow>{limit}</yellow> players.</red>"

  # Maintenance locks
  warp-locked: "<red><yellow>{name}</yellow> is closed: <gray>{reason}</gray></red>"
  server-locked: "<red><yellow>{server}</yellow> is closed: <gray>{reason}</gray></red>"

  history-disabled: "<red>Teleport history is turned off in config.yml.</red>"
  specify-home: "<red>Please specify a home name!</red>"
  # Shown by /home with no argument when there is more than one to choose from.
  multiple-homes: "<red>Pick a home: <yellow>{homes}</yellow></red>"
  specify-warp-name: "<red>Please specify a warp name!</red>"
  home-not-found: "<red>Home '<yellow>{name}</yellow>' not found!</red>"
  warp-not-found: "<red>Warp '<yellow>{name}</yellow>' not found!</red>"
  spawn-not-set: "<red>Spawn has not been set yet!</red>"
  world-not-found: "<red>World not found!</red>"
  no-homes: "<red>You don't have any homes!</red>"
  no-warps: "<red>There are no warps you can use.</red>"
  home-already-exists: "<red>You already have a home called '<yellow>{name}</yellow>'!</red>"
  home-limit-reached: "<red>You have reached your home limit! (<yellow>{limit}</yellow>)</red>"
  # Staff-facing variants, for the /listhomes and <player>:<home> commands
  no-homes-other: "<red><yellow>{player}</yellow> doesn't have any homes!</red>"
  home-not-found-other: "<red><yellow>{player}</yellow> has no home called '<yellow>{name}</yellow>'!</red>"
  player-never-played: "<red>This server has never seen a player called '<yellow>{player}</yellow>'!</red>"
  cannot-teleport-self: "<red>You cannot teleport to yourself!</red>"
  world-blacklisted: "<red>You cannot teleport to that world!</red>"
  insufficient-funds: "<red>You don't have enough money! Cost: <yellow>{cost}</yellow></red>"
  cooldown: "<red>You must wait <yellow>{time}</yellow> seconds before teleporting again!</red>"
  tpa-disabled: "<red><yellow>{player}</yellow> has teleport requests disabled!</red>"
  no-pending-requests: "<red>You have no pending teleport requests!</red>"
  no-outgoing-requests: "<red>You have no outgoing teleport requests!</red>"
  transfer-failed: "<red>Could not send you to that server. Please try again.</red>"
  server-unavailable: "<red>That destination is on <yellow>{server}</yellow>, which cannot be reached right now.</red>"
  teleport-expired: "<red>Your teleport took too long and was cancelled.</red>"
  network-error: "<red>The teleport network did not respond. Please try again.</red>"
  database-error: "<red>That could not be saved. Please tell an administrator.</red>"
  invalid-permission: "<red>'<yellow>{permission}</yellow>' is not a valid permission node. Use words separated by dots, like <white>server.warp.vip</white>.</red>"
  invalid-name: "<red>Use only letters, numbers, - and _, up to <yellow>{max}</yellow> characters.</red>"
  warp-on-other-server: "<red>Warp '<yellow>{name}</yellow>' already exists on <yellow>{server}</yellow>. Delete it there first.</red>"
  request-already-sent: "<red>You already have a request waiting for <yellow>{player}</yellow>!</red>"
  too-many-requests: "<red>You already have <yellow>{limit}</yellow> requests waiting.</red>"

  invalid-material: "<red>'<yellow>{material}</yellow>' is not a valid item.</red>"
  invalid-amount: "<red>'<yellow>{value}</yellow>' is not a valid amount.</red>"

  # Player warps (/pw)
  player-warp-not-found: "<red>Player warp '<yellow>{name}</yellow>' not found!</red>"
  player-warp-name-taken: "<red>The name '<yellow>{name}</yellow>' is already used by another player warp.</red>"
  player-warp-limit-reached: "<red>You have reached your player warp limit! (<yellow>{limit}</yellow>)</red>"
  player-warp-locked: "<red>'<yellow>{name}</yellow>' is locked by its owner.</red>"
  player-warp-banned: "<red>You are banned from '<yellow>{name}</yellow>'.</red>"
  player-warp-not-whitelisted: "<red>'<yellow>{name}</yellow>' is whitelisted and you are not on the list.</red>"
  player-warp-category-not-found: "<red>Category '<yellow>{category}</yellow>' does not exist.</red>"
  player-warp-password-length: "<red>The password must be between <yellow>{min}</yellow> and <yellow>{max}</yellow> characters.</red>"
  player-warp-icon-empty-hand: "<red>Hold an item to use as the icon, or give a material name after the warp.</red>"
  player-warp-world-blacklisted: "<red>Player warps cannot be created or moved into this world.</red>"

  back-not-set: "<red>You don't have anywhere to go back to.</red>"
  back-disabled: "<red>/back is turned off on this server.</red>"
  back-destination-blacklisted: "<red>You cannot go back there.</red>"

  # Safety errors
  unsafe-location:
    void: "<red>That location is in the void!</red>"
    lava: "<red>That location is dangerous - lava detected!</red>"
    suffocation: "<red>That location would suffocate you!</red>"
    water-trap: "<red>That location is a water trap!</red>"
    too-high: "<red>That location is too high!</red>"
    no-floor: "<red>That location has no floor!</red>"

# Home messages
home:
  created: "<green>Home '<yellow>{name}</yellow>' created successfully!</green>"
  updated: "<green>Home '<yellow>{name}</yellow>' updated successfully!</green>"
  deleted: "<green>Home '<yellow>{name}</yellow>' deleted successfully!</green>"
  confirm-overwrite: "<yellow>'<gold>{name}</gold>' already exists. Run the command again within 15s to move it.</yellow>"
  renamed: "<green>Home '<yellow>{old}</yellow>' is now '<yellow>{new}</yellow>'.</green>"
  moved: "<green>Home '<yellow>{name}</yellow>' moved here.</green>"

  # Staff commands. {player} is the owner acted on, not the sender.
  admin-created: "<green>Home '<yellow>{name}</yellow>' created for <yellow>{player}</yellow>!</green>"
  admin-updated: "<green>Home '<yellow>{name}</yellow>' of <yellow>{player}</yellow> updated!</green>"
  admin-deleted: "<green>Home '<yellow>{name}</yellow>' of <yellow>{player}</yellow> deleted!</green>"

  # /listhomes. {count} is the number of entries that follow.
  list-header: "<gold>Homes of <yellow>{player}</yellow> (<yellow>{count}</yellow>):</gold>"
  list-entry: "<gray>- <yellow>{name}</yellow> in <white>{world}</white> at <white>{x} {y} {z}</white> (<white>{server}</white>)</gray>"

# Warp messages
warp:
  created: "<green>Warp '<yellow>{name}</yellow>' created successfully!</green>"
  updated: "<green>Warp '<yellow>{name}</yellow>' updated successfully!</green>"
  deleted: "<green>Warp '<yellow>{name}</yellow>' deleted successfully!</green>"
  sent-other: "<green>Sent <yellow>{player}</yellow> to warp '<yellow>{name}</yellow>'.</green>"

  permission-set: "<green>Warp '<yellow>{name}</yellow>' now requires <yellow>{permission}</yellow>.</green>"

  # Per-warp cost, cooldown and delay. Clearing one puts the warp back on the global setting,
  # which is not the same as setting it to zero.
  override-set: "<green>Warp '<yellow>{name}</yellow>' now uses <yellow>{field} {value}</yellow>.</green>"
  override-cleared: "<green>Warp '<yellow>{name}</yellow>' now uses the default <yellow>{field}</yellow>.</green>"

  # /warps. {count} is the total the sender may use, across all pages.
  list-header: "<gold>Warps (<yellow>{count}</yellow>) — page <yellow>{page}</yellow>/<yellow>{pages}</yellow>:</gold>"
  list-entry: "<gray>- <yellow>{name}</yellow> in <white>{world}</white> at <white>{x} {y} {z}</white> (<white>{server}</white>)</gray>"

# Spawn messages
spawn:
  set: "<green>Spawn set successfully!</green>"
  sent-other: "<green>Sent <yellow>{player}</yellow> to spawn.</green>"

# TPA messages
tpa:
  # The clickable buttons shown under an incoming request.
  button-accept: "<green>[ACCEPT]</green>"
  button-deny: "<red>[DENY]</red>"

  request-sent: "<green>Teleport request sent to <yellow>{player}</yellow>!</green>"
  # {direction} is filled from direction-to-you / direction-to-them below.
  request-received: "<yellow>{player}</yellow> wants {direction}. Expires in <yellow>{time}</yellow>s."
  request-received-remote: "<yellow>{player}</yellow> wants {direction}, from <gold>{server}</gold>. Expires in <yellow>{time}</yellow>s."
  direction-to-you: "to teleport to you"
  direction-to-them: "you to teleport to them"
  request-accepted: "<green>Teleport request accepted!</green>"
  request-denied: "<red>Teleport request denied!</red>"
  request-cancelled: "<yellow>Teleport request cancelled!</yellow>"
  request-expired: "<red>Teleport request expired!</red>"
  enabled: "<green>Teleport requests enabled!</green>"
  disabled: "<red>Teleport requests disabled!</red>"

  # /tpablock. A blocked player is never told they were blocked — they see the same refusal as
  # somebody who turned requests off entirely, which is the point of a quiet block.
  blocked: "<green>Blocked teleport requests from <yellow>{player}</yellow>.</green>"
  unblocked: "<green>Unblocked <yellow>{player}</yellow>.</green>"
  block-list-header: "<gold>Blocked players (<yellow>{count}</yellow>):</gold>"
  block-list-entry: "<gray>- <yellow>{player}</yellow></gray>"
  block-list-empty: "<gray>You have not blocked anybody.</gray>"

# Player warps (/pw)
player-warp:
  created: "<green>Player warp '<yellow>{name}</yellow>' created successfully!</green>"
  deleted: "<green>Player warp '<yellow>{name}</yellow>' deleted successfully!</green>"
  renamed: "<green>Player warp '<yellow>{old}</yellow>' is now '<yellow>{new}</yellow>'.</green>"
  reset: "<green>'<yellow>{name}</yellow>' now points here.</green>"
  transferred: "<green>'<yellow>{name}</yellow>' is now owned by <yellow>{player}</yellow>.</green>"

  removeall:
    none: "<yellow><yellow>{player}</yellow> does not own any player warps.</yellow>"
    success: "<green>Removed <yellow>{count}</yellow> player warp(s) belonging to <yellow>{player}</yellow>.</green>"

  desc:
    set: "<green>Description of '<yellow>{name}</yellow>' updated.</green>"
    removed: "<green>Description of '<yellow>{name}</yellow>' cleared.</green>"

  icon:
    set: "<green>Icon of '<yellow>{name}</yellow>' updated.</green>"
    removed: "<green>Icon of '<yellow>{name}</yellow>' reset to the default.</green>"

  category:
    set: "<green>'<yellow>{name}</yellow>' filed under <yellow>{category}</yellow>.</green>"
    removed: "<green>'<yellow>{name}</yellow>' no longer has a category.</green>"
    list-header: "<gold>Categories (<yellow>{count}</yellow>):</gold>"
    list-entry: "<gray>- <yellow>{id}</yellow> <dark_gray>{name}</dark_gray></gray>"

  cost:
    set: "<green>'<yellow>{name}</yellow>' now costs <yellow>{cost}</yellow> to use.</green>"
    removed: "<green>'<yellow>{name}</yellow>' is free to use again.</green>"

  lock:
    locked: "<green>'<yellow>{name}</yellow>' is now locked.</green>"
    unlocked: "<green>'<yellow>{name}</yellow>' is now unlocked.</green>"

  password:
    set: "<green>A password has been set on '<yellow>{name}</yellow>'.</green>"
    removed: "<green>The password on '<yellow>{name}</yellow>' has been removed.</green>"
    required: "<yellow>'<yellow>{name}</yellow>' is password-protected.</yellow>"
    wrong: "<red>Wrong password for '<yellow>{name}</yellow>'. Try again.</red>"
    prompt: "<yellow>Type the password in chat, or type <white>cancel</white>.</yellow>"

  whitelist:
    added: "<green>Added <yellow>{player}</yellow> to the whitelist of '<yellow>{warp}</yellow>'.</green>"
    removed: "<green>Removed <yellow>{player}</yellow> from the whitelist of '<yellow>{warp}</yellow>'.</green>"
    not-found: "<red><yellow>{player}</yellow> is not whitelisted on '<yellow>{warp}</yellow>'.</red>"
    already-added: "<red><yellow>{player}</yellow> is already whitelisted on '<yellow>{warp}</yellow>'.</red>"
    limit-reached: "<red>The whitelist is full (<yellow>{limit}</yellow>).</red>"
    enabled: "<green>Whitelist enabled on '<yellow>{name}</yellow>'.</green>"
    disabled: "<green>Whitelist disabled on '<yellow>{name}</yellow>'.</green>"
    header: "<gold>Whitelist of <yellow>{warp}</yellow> (<yellow>{count}</yellow>):</gold>"
    entry: "<gray>- <yellow>{player}</yellow></gray>"
    empty: "<gray>Nobody is whitelisted.</gray>"

  ban:
    added: "<green>Banned <yellow>{player}</yellow> from '<yellow>{warp}</yellow>': <gray>{reason}</gray></green>"
    added-temporary: "<green>Banned <yellow>{player}</yellow> from '<yellow>{warp}</yellow>' temporarily: <gray>{reason}</gray></green>"
    removed: "<green>Unbanned <yellow>{player}</yellow> from '<yellow>{warp}</yellow>'.</green>"
    not-found: "<red><yellow>{player}</yellow> is not banned from '<yellow>{warp}</yellow>'.</red>"
    is-owner: "<red>You cannot ban <yellow>{player}</yellow>, they own this warp.</red>"
    limit-reached: "<red>The ban list is full (<yellow>{limit}</yellow>).</red>"
    notify: "<red>You have been banned from '<yellow>{warp}</yellow>': <gray>{reason}</gray></red>"
    header: "<gold>Bans on <yellow>{warp}</yellow> (<yellow>{count}</yellow>):</gold>"
    entry: "<gray>- <yellow>{player}</yellow> <dark_gray>({reason}, expires: {expires})</dark_gray></gray>"
    empty: "<gray>Nobody is banned.</gray>"

  managers:
    added: "<green>Added <yellow>{player}</yellow> as a manager of '<yellow>{warp}</yellow>'.</green>"
    removed: "<green>Removed <yellow>{player}</yellow> as a manager of '<yellow>{warp}</yellow>'.</green>"
    not-found: "<red><yellow>{player}</yellow> is not a manager of '<yellow>{warp}</yellow>'.</red>"
    already-added: "<red><yellow>{player}</yellow> is already a manager of '<yellow>{warp}</yellow>'.</red>"
    is-owner: "<red><yellow>{player}</yellow> already owns this warp.</red>"
    header: "<gold>Managers of <yellow>{warp}</yellow> (<yellow>{count}</yellow>):</gold>"
    entry: "<gray>- <yellow>{player}</yellow></gray>"
    empty: "<gray>No managers.</gray>"

  favourite:
    added: "<green>'<yellow>{warp}</yellow>' added to your favourites.</green>"
    removed: "<green>'<yellow>{warp}</yellow>' removed from your favourites.</green>"

  rate:
    success: "<green>You rated '<yellow>{warp}</yellow>' <yellow>{stars}</yellow>/5.</green>"
    own-warp: "<red>You cannot rate your own warp.</red>"
    cooldown: "<red>You can change your rating again in <yellow>{time}</yellow>h.</red>"

  input:
    prompt: "<yellow>{prompt}</yellow>"
    cancelled: "<yellow>Cancelled.</yellow>"

  prompts:
    description: "New description for '{name}' (type 'cancel' to keep it)"
    icon: "New icon material for '{name}', e.g. DIAMOND_BLOCK"
    cost: "New cost for '{name}'"
    password: "New password for '{name}'"
    rename: "New name for '{name}'"
    whitelist-add: "Player to whitelist on '{name}'"
    ban-add: "Player to ban from '{name}'"
    ban-reason: "Reason for banning {player} (or 'skip')"
    managers-add: "Player to add as a manager of '{name}'"
    search: "Search term for player warps"
    rating-comment: "Type a short comment for your {stars}-star rating, or 'skip'"

  list:
    header: "<gold>Player warps (<yellow>{count}</yellow>) — page <yellow>{page}</yellow>/<yellow>{pages}</yellow>:</gold>"
    entry: "<gray>- <yellow>{name}</yellow> <dark_gray>by</dark_gray> <white>{owner}</white> <dark_gray>({world})</dark_gray></gray>"

  sponsor:
    success: "<green>'<yellow>{warp}</yellow>' is now sponsored for <yellow>{hours}</yellow>h. Charged <yellow>{cost}</yellow>.</green>"
    disabled: "<red>Sponsored slots are turned off on this server.</red>"
    invalid-slot: "<red>That is not a valid sponsored slot.</red>"
    slot-taken: "<red>That sponsored slot is already taken.</red>"
    already-sponsored: "<red>'<yellow>{warp}</yellow>' is already sponsored in another slot.</red>"

# /glteleports reload
reload:
  success: "<green>Configuration reloaded.</green>"
  invalid: "<red>Not reloaded — <yellow>{error}</yellow>. The previous configuration is still in use.</red>"
  # {section} is read only at startup, so an edit to it needs a restart
  restart-required: "<yellow><gold>{section}</gold> changed, but it is only read at startup. Restart the server to apply it.</yellow>"

# Teleport messages
teleport:
  # {name} is the home or warp arrived at, the other player for tpa and tpahere, and the server
  # name for spawn. It is empty for teleports with nothing to name.
  success: "<green>Teleported successfully!</green>"
  delay-cancelled: "<red>Teleport cancelled!</red>"
  transferring: "<yellow>Sending you to <gold>{server}</gold>...</yellow>"
  refunded: "<green><yellow>{cost}</yellow> has been returned to you.</green>"
  returned: "<gray>Returned to where you left this server.</gray>"
  # Only shown once the queue is deeper than queue.notice-threshold; below that the wait is a
  # tick or two and saying anything would be noise.
  queued: "<gray>Teleporting shortly... (<yellow>{position}</yellow> ahead of you)</gray>"

# Values substituted into placeholders and menus rather than sent on their own.
placeholders:
  unlimited: "∞"
  free: "Free"

# Homes shared through /homeinvite.
share:
  granted: "<green>Gave <yellow>{player}</yellow> access to <yellow>{home}</yellow>.</green>"
  granted-temporary: "<green>Gave <yellow>{player}</yellow> access to <yellow>{home}</yellow> for <yellow>{time}s</yellow>.</green>"
  received: "<green><yellow>{player}</yellow> shared their home <yellow>{home}</yellow> with you. Use <yellow>/home {player}:{home}</yellow>.</green>"
  revoked: "<yellow>Took back <yellow>{player}</yellow>'s access to <yellow>{home}</yellow>.</yellow>"
  permanent: "never"
  header-received: "<gold>Homes shared with you (<yellow>{count}</yellow>):</gold>"
  header-given: "<gold>Homes you have shared (<yellow>{count}</yellow>):</gold>"
  entry-received: "<gray>- <yellow>{player}</yellow>:<white>{home}</white> <dark_gray>(expires: {expires})</dark_gray></gray>"
  entry-given: "<gray>- <white>{home}</white> <dark_gray>to</dark_gray> <yellow>{player}</yellow> <dark_gray>(expires: {expires})</dark_gray></gray>"
  none-received: "<gray>Nobody has shared a home with you.</gray>"
  none-given: "<gray>You have not shared any homes.</gray>"

# /glteleports history
history:
  header: "<gold>Teleport history for <yellow>{subject}</yellow> (<yellow>{count}</yellow>):</gold>"
  empty: "<gray>No teleports recorded for <yellow>{subject}</yellow>.</gray>"
  entry: "<gray><dark_gray>{date}</dark_gray> <yellow>{type}</yellow> <white>{destination}</white> <dark_gray>{from} → {to}</dark_gray></gray>"
  entry-cross: "<gray><dark_gray>{date}</dark_gray> <yellow>{type}</yellow> <white>{destination}</white> <aqua>{from-server} → {to-server}</aqua> <dark_gray>{to}</dark_gray></gray>"

# /glteleports lock
lock:
  default-reason: "Maintenance"
  placed: "<green>Closed <yellow>{type} {target}</yellow>: <gray>{reason}</gray></green>"
  lifted: "<green>Reopened <yellow>{type} {target}</yellow>.</green>"
  not-found: "<red><yellow>{type} {target}</yellow> was not closed.</red>"
  header: "<gold>Closed destinations (<yellow>{count}</yellow>):</gold>"
  entry: "<gray>- <yellow>{type}</yellow> <white>{target}</white> <dark_gray>({reason}, by {by})</dark_gray></gray>"
  none: "<gray>Nothing is closed right now.</gray>"

# /glteleports status
status:
  header: "<gold>GL-Teleports status:</gold>"
  database: "<gray>- storage: <white>{type}</white></gray>"
  server: "<gray>- this server: <white>{server}</white></gray>"
  bus-disabled: "<gray>- multi-server: <white>turned off in config.yml</white></gray>"
  bus-offline: "<gray>- multi-server: <red>offline</red> — cross-server destinations are refused; retrying in the background</gray>"
  bus-online: "<gray>- multi-server: <green>online</green> on channel <white>{channel}</white></gray>"
  servers: "<gray>- servers seen (<white>{count}</white>): <white>{servers}</white></gray>"
  network-players: "<gray>- players elsewhere on the network: <white>{count}</white></gray>"
  pending: "<gray>- teleports waiting to land here: <white>{count}</white></gray>"
  version: "<gray>GL-Teleports <white>{version}</white></gray>"

  # /glteleports debug <player>
  debug-header: "<gold>State held for <yellow>{player}</yellow>:</gold>"
  debug-homes: "<gray>- homes cached: <white>{count}</white> of <white>{limit}</white></gray>"
  debug-delay: "<gray>- countdown running: <white>{active}</white></gray>"
  debug-immunity: "<gray>- damage immunity: <white>{active}</white></gray>"
  debug-requests: "<gray>- teleport requests: <white>{incoming}</white> in, <white>{outgoing}</white> out</gray>"
  debug-cooldown: "<gray>- cooldown on <white>{type}</white>: <white>{time}</white>s</gray>"

# /glteleports backup
backup:
  started: "<yellow>Writing a backup...</yellow>"
  finished: "<green>Backup written to <yellow>{file}</yellow>.</green>"
  failed: "<red>The backup could not be written. Check the console.</red>"

# /glteleports migrate <source> [types] [confirm]
migrate:
  usage: '<gray>/glteleports migrate \<{sources}> [types] [confirm] (types: homes, warps, playerwarps; separate multiple with commas)</gray>'
  scanning: "<yellow>Reading <gold>{source}</gold> data. Nothing will be written yet...</yellow>"
  importing: "<yellow>Importing <gold>{source}</gold> data...</yellow>"
  scan-header: "<gold>{source} migration scan</gold> <gray>({storage}, {duration})</gray>"
  done-header: "<green>Migration from <gold>{source}</gold> completed in <yellow>{duration}</yellow>.</green>"
  selection: "<gray>Selected data: <white>{selection}</white>.</gray>"
  world-mappings: "<gray>World changes for this import: <white>{mappings}</white>.</gray>"
  summary-players: "<gray>Players with homes: <white>{players}</white></gray>"
  summary-homes: "<gray>Homes: <white>{found}</white> found, <green>{imported}</green> to import (<white>{new}</white> new, <white>{renamed}</white> renamed, <white>{replaced}</white> replacing), <white>{unchanged}</white> already here, <yellow>{conflicts}</yellow> conflicts, <white>{elsewhere}</white> on other servers, <red>{invalid}</red> invalid</gray>"
  summary-warps: "<gray>Warps: <white>{found}</white> found, <green>{imported}</green> to import (<white>{new}</white> new, <white>{renamed}</white> renamed, <white>{replaced}</white> replacing), <white>{unchanged}</white> already here, <yellow>{conflicts}</yellow> conflicts, <white>{elsewhere}</white> on other servers, <red>{invalid}</red> invalid</gray>"
  done-homes: "<gray>Homes imported: <green>{imported}</green> (<white>{renamed}</white> renamed, <white>{replaced}</white> replaced) · skipped: <yellow>{skipped}</yellow> · failed: <red>{invalid}</red></gray>"
  done-warps: "<gray>Warps imported: <green>{imported}</green> (<white>{renamed}</white> renamed, <white>{replaced}</white> replaced) · skipped: <yellow>{skipped}</yellow> · failed: <red>{invalid}</red></gray>"
  summary-player-warp-owners: "<gray>Players with player warps: <white>{players}</white></gray>"
  summary-player-warps: "<gray>Player warps: <white>{found}</white> found, <green>{imported}</green> to import (<white>{new}</white> new, <white>{renamed}</white> renamed), <white>{unchanged}</white> already here, <yellow>{conflicts}</yellow> conflicts, <white>{elsewhere}</white> on other servers, <red>{invalid}</red> invalid</gray>"
  done-player-warps: "<gray>Player warps imported: <green>{imported}</green> (<white>{renamed}</white> renamed) · skipped: <yellow>{skipped}</yellow> · failed: <red>{invalid}</red></gray>"
  summary-player-warp-links: "<gray>With them, to import: favourites <white>{favourites}</white>/{favourites-found}, ratings <white>{ratings}</white>/{ratings-found}, whitelisted <white>{whitelist}</white>/{whitelist-found}, managers <white>{managers}</white>/{managers-found}, bans <white>{bans}</white>/{bans-found}</gray>"
  done-player-warp-links: "<gray>With them, imported: favourites <green>{favourites}</green>/{favourites-found}, ratings <green>{ratings}</green>/{ratings-found}, whitelisted <green>{whitelist}</green>/{whitelist-found}, managers <green>{managers}</green>/{managers-found}, bans <green>{bans}</green>/{bans-found}</gray>"
  summary-player-warp-links-left: "<gray>Not imported: <white>{with-warp}</white> belong to warps that are not imported, <white>{duplicates}</white> duplicates merged, <red>{invalid}</red> invalid (ratings outside 1-5, bans already over).</gray>"
  summary-unknown-categories: "<yellow>Categories not defined in player-warps.yml: <white>{categories}</white>. The warps keep them; add them to player-warps.yml to show them in the menu.</yellow>"
  summary-adjusted: "<gray><white>{count}</white> entries are imported with a change (name, icon, shortened text...); see the log.</gray>"
  not-carried-over-header: "<yellow>Kept in the source only, no equivalent here:</yellow>"
  not-carried-over-entry: "<gray> - {what}: <white>{amount}</white></gray>"
  summary-unreadable: "<red>{count}</red> <gray>records could not be read at all (corrupt files, missing positions).</gray>"
  summary-public: "<gray><white>{count}</white> public homes will become ordinary homes; use /homeinvite to share them again.</gray>"
  summary-restricted: "<gray><white>{count}</white> warps keep the permission the source required to use them.</gray>"
  summary-unloaded-worlds: "<yellow>{count} entries point at worlds that are not loaded on this server; they are imported, but cannot be used until those worlds exist.</yellow>"
  target-local: "<gray>Multi-server is off: everything is assigned to this server (<white>{server}</white>).</gray>"
  target-source: "<gray>Entries keep the server the source recorded; the rest are assigned to <white>{server}</white>.</gray>"
  target-server: "<gray>Everything is assigned to server <white>{server}</white>.</gray>"
  log-written: "<gray>Details: <white>{file}</white></gray>"
  nothing-to-import: "<green>Nothing to import from {source}: everything is either already here or unusable.</green>"
  confirm: "<yellow>Nothing has been written. Conflicts will be handled as <gold>{policy}</gold>. Back up your data, then run <gold>{command}</gold> within {seconds}s to import.</yellow>"
  errors:
    unknown-source: "<red><yellow>{source}</yellow> is not a plugin that can be migrated. Available: <yellow>{sources}</yellow>.</red>"
    invalid-policy: "<red>migrate.conflict-policy is <yellow>{policy}</yellow> in config.yml; use skip, rename or replace.</red>"
    invalid-selection: "<red>Unknown migration data type <yellow>{selection}</yellow>; use homes, warps, playerwarps or all.</red>"
    invalid-world-mapping: "<red>Invalid migrate.world-mappings in config.yml: <yellow>{error}</yellow>. Nothing was written.</red>"
    already-running: "<red>A migration is already running. Wait for it to finish.</red>"
    scan-first: "<red>Scan again and confirm within two minutes using the same source and data types. The conflict policy and world mappings must also stay the same.</red>"
    not-found: "<red>No {source} data was found in <yellow>{path}</yellow>. Is the plugin's folder there? Set migrate.folders in config.yml to read it from elsewhere.</red>"
    server-required: "<red>Multi-server is on and {source} does not record which server its data belongs to. Set <yellow>migrate.server</yellow> in config.yml to that server's name, then try again. Nothing was written.</red>"
    unsupported-database: "<red>{source} is configured with database type <yellow>{type}</yellow>, which cannot be read.</red>"
    driver-missing: "<red>The database driver <yellow>{driver}</yellow> is not available, so {source} data cannot be read. Restart the server so it can download it.</red>"
    connect-failed: "<red>Could not connect to the {source} database: <yellow>{error}</yellow>. Nothing was written.</red>"
    read-failed: "<red>{source} data could not be read: <yellow>{error}</yellow>. Nothing was written.</red>"
    write-failed: "<red>The import failed while writing: <yellow>{error}</yellow>. Check the console; on mysql, sqlite and h2 nothing was written.</red>"

# Command usage lines, shown when a command is used incorrectly.
# Single-quoted so the backslashes survive YAML: \< escapes the angle bracket for MiniMessage,
# which would otherwise try to read <name> as a tag.
usage:
  glteleports: '<gray>/glteleports \<reload|backup|status|debug|history|lock|unlock|locks|migrate|version></gray>'
  sethome: '<gray>/sethome [name]  |  /sethome \<player>:\<home> (staff)</gray>'
  home: '<gray>/home \<name></gray>'
  renamehome: '<gray>/renamehome \<old> \<new></gray>'
  movehome: '<gray>/movehome \<name></gray>'
  delhome: '<gray>/delhome \<name>  |  /delhome \<player>:\<home> (staff)</gray>'
  listhomes: '<gray>/listhomes [player]</gray>'
  setwarp: '<gray>/setwarp \<name> [permission]</gray>'
  warp: '<gray>/warp \<name> [player] (staff)</gray>'
  warps: '<gray>/warps [page]</gray>'
  editwarp: '<gray>/editwarp \<name> \<permission|cost|cooldown|delay> [value|default]</gray>'
  delwarp: '<gray>/delwarp \<name></gray>'
  setspawn: '<gray>/setspawn</gray>'
  spawn: '<gray>/spawn [player] (staff)</gray>'
  tpa: '<gray>/tpa \<player></gray>'
  tpahere: '<gray>/tpahere \<player></gray>'
  tpaccept: '<gray>/tpaccept [player]</gray>'
  tpdeny: '<gray>/tpdeny [player]</gray>'
  tpacancel: '<gray>/tpacancel [player]</gray>'
  tpatoggle: '<gray>/tpatoggle</gray>'
  tpablock: '<gray>/tpablock \<add|remove|list> [player]</gray>'
  homes: '<gray>/homes</gray>'
  homeinvite: '<gray>/homeinvite \<player> \<home> [duration]</gray>'
  homeuninvite: '<gray>/homeuninvite \<player> \<home></gray>'
  homeinvites: '<gray>/homeinvites [received|given]</gray>'
  pw: '<gray>/pw \<warp>  |  /pw set \<name> [player]  |  /pw remove \<warp>  |  /pw list [page] [player]  |  /pw settings \<warp>  |  see the wiki for the full subcommand list</gray>'
  back: '<gray>/back</gray>'
